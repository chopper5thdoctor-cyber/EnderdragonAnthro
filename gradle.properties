org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Two Windows annoyances, both off by default here.
#
# The Gradle daemon is a JVM that deliberately OUTLIVES the build and detaches
# from the console, so closing the cmd window leaves an "OpenJDK Platform
# Binary" running and holding the project folder open. Without it, the JVM is
# an ordinary child of cmd and dies with the window. Builds cost a few extra
# seconds of JVM startup, which is a fair trade for not visiting Task Manager.
org.gradle.daemon=false
#
# File-system watching keeps OS-level handles on the project directory, which
# is the other reason Windows refuses to delete the folder afterwards.
org.gradle.vfs.watch=false

# Minecraft 1.20.5+ is required for the vanilla scale/step-height/reach attributes
# (see DESIGN.md section 5.5). Versions below were pinned offline — if resolution
# fails, take the current numbers for MC 1.21.1 from https://fabricmc.net/develop/
minecraft_version=1.21.1
loader_version=0.18.4
fabric_version=0.116.13+1.21.1
# Loom 1.12+ is the first line that runs on Gradle 9; Gradle 9.1+ is needed for Java 25
loom_version=1.12-SNAPSHOT

mod_version=0.1.0
maven_group=com.enderdragonanthro
