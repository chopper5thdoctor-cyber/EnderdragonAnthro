plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'enderdragonanthro'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// ---------------------------------------------------------------- game tests
//
// A headless server that builds a scratch world, runs every @GameTest against
// it and exits non-zero if one fails. This is the only harness in the project
// that observes the WORLD rather than the code: the build proves it compiles,
// audit_injections.py proves the hooks attached, and this proves that a zombie
// standing next to a dragon actually ends up further away.
//
//   ./gradlew runGametest
//
loom {
    runs {
        gametest {
            server()
            name = 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
            runDir 'build/gametest'
        }
    }
}

// ------------------------------------------------------------- smoke harness
//
// A real client that creates a flat world, plays through a checklist and exits
// with a status code. Reaches the things GameTest cannot: textures resolving,
// model layers baking, a keypress surviving the round trip to the server, and
// a widget actually appearing on a screen.
//
//   ./gradlew runSmoke        the checks that need no world
//   ./gradlew runSmokeWorld   those, plus the round trips through a real world
//
// ---- on a machine with no display ----------------------------------------
//
// Both need a window and an OpenGL context, but neither needs a GPU. Mesa's
// llvmpipe renders in software and is quite fast enough for a harness that
// never looks at a frame:
//
//   LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
//     xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runSmokeWorld
//
// Without that, GLFW fails at init with "Failed to detect any supported
// platform" and the run reads as a mod crash rather than as a missing display.
//
loom {
    runs {
        smoke {
            client()
            name = 'Smoke Test'
            vmArg '-Denderdragonanthro.smoke=true'
            // Offline, and fast about it. A dev client still asks Mojang for a
            // chat-signing key on join, and with no route out that call sits
            // there for five minutes before giving up -- which looks exactly
            // like the harness having hung. Pointing the API hosts at a dead
            // address makes it fail immediately instead.
            vmArg '-Dminecraft.api.auth.host=http://0.0.0.0'
            vmArg '-Dminecraft.api.account.host=http://0.0.0.0'
            vmArg '-Dminecraft.api.session.host=http://0.0.0.0'
            vmArg '-Dminecraft.api.services.host=http://0.0.0.0'
            runDir 'build/smoke'
        }
        // The same harness, allowed to load a world and do the round trips.
        // Needs a machine that can complete a login; see WORLD_FLAG.
        smokeWorld {
            client()
            name = 'Smoke Test (world)'
            vmArg '-Denderdragonanthro.smoke=true'
            vmArg '-Denderdragonanthro.smoke.world=true'
            runDir 'build/smoke'
        }

        // ------------------------------------------------- two players at once
        //
        // Almost everything in this mod is drawn on the player it belongs to,
        // and every one of those has been looked at from inside that player's
        // own head. A second pair of eyes is a different question: the wings,
        // the tail, the form itself and the court are all things somebody ELSE
        // sees, and a bug there is invisible in singleplayer by construction.
        //
        //   run.bat                          all three, in order, ready to go
        //
        // or by hand:
        //
        //   ./gradlew prepareMultiplayer     once, writes server.properties
        //   ./gradlew runServer              then leave it running
        //   ./gradlew runClientOne           the wide one
        //   ./gradlew runClientTwo           the slim one
        //
        // Both auto-connect to localhost and get their own run directory, so
        // they do not fight over options.txt.
        //
        // ---- the names are load-bearing ----------------------------------
        //
        // An offline server derives a player's UUID from the name
        // (UUIDUtil.createOfflinePlayerUUID -> nameUUIDFromBytes of
        // "OfflinePlayer:<name>"), and DefaultPlayerSkin picks the default skin
        // with floorMod(uuid.hashCode(), 18) over a table whose first nine
        // entries are SLIM and whose last nine are WIDE.
        //
        // So the model is a pure function of the name, and these two were
        // chosen by computing it rather than by hoping:
        //
        //     Jean_Wide -> index 14 -> WIDE (noor)
        //     Jean_Slim -> index  2 -> SLIM (efe)
        //
        // That matters because the arm on a slim model is three pixels wide,
        // not four, and every layer this mod hangs off an arm has only ever
        // been looked at on a wide one. The name says which you are looking at,
        // so a bug that only shows on one of them is attributable on sight.
        clientOne {
            client()
            name = 'Minecraft Client 1 (wide)'
            runDir 'run'
            programArg '--username'
            programArg 'Jean_Wide'
            programArg '--quickPlayMultiplayer'
            programArg 'localhost'
        }
        clientTwo {
            client()
            name = 'Minecraft Client 2 (slim)'
            runDir 'run2'
            programArg '--username'
            programArg 'Jean_Slim'
            programArg '--quickPlayMultiplayer'
            programArg 'localhost'
        }
    }
}

/**
 * Make the dev server joinable by two offline clients.
 *
 * A dev client has no Mojang session, so a server left on online-mode refuses
 * both of them with "Failed to verify username" -- which reads as a mod problem
 * and is not one.
 *
 * Deliberately does not write eula.txt. Accepting Mojang's EULA is the author's
 * to do, not a build script's; it is one line and the task says which.
 */
tasks.register('prepareMultiplayer') {
    group = 'fabric'
    description = 'Write a dev server.properties that two offline clients can join.'
    doLast {
        def run = file('run')
        run.mkdirs()
        def properties = new File(run, 'server.properties')
        if (properties.exists()) {
            logger.lifecycle("kept ${properties} as it is")
        } else {
            properties.text = [
                '# Written by ./gradlew prepareMultiplayer, for local testing only.',
                'online-mode=false',
                'motd=EnderdragonAnthro dev',
                'view-distance=8',
                'spawn-protection=0',
                'gamemode=creative',
                'level-type=minecraft\\:flat',
                'sync-chunk-writes=false',
                ''
            ].join('\n')
            logger.lifecycle("wrote ${properties} (online-mode=false)")
        }
        def eula = new File(run, 'eula.txt')
        if (!eula.exists() || !eula.text.contains('eula=true')) {
            logger.lifecycle('')
            logger.lifecycle('Now do this one thing yourself, because it is an agreement')
            logger.lifecycle('and not a build step:')
            logger.lifecycle("  put  eula=true  in  ${eula}")
            logger.lifecycle('  (run ./gradlew runServer once and it will create the file)')
        }
    }
}
