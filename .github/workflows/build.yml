name: build

# Every push gets compiled against real Minecraft.
#
# The machine this mod is written on cannot reach Fabric's maven or Mojang's
# object stores, so for a long time "does it build" was a question only the
# author could answer, by running it and reading the console. Two builds broke
# that way. A runner has unrestricted egress and answers it in about four
# minutes instead.
#
# This is also the only check that sees the mixins. Loom runs the Mixin
# annotation processor against the real, mapped Minecraft classes, so an
# @Inject naming a method that does not exist in 1.21.1 fails here. Several of
# them carry require = 0, which means that in a running game they fail in
# total silence -- the ability simply never happens.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push makes an in-flight build of the same branch pointless.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Seconds, and no toolchain needed. Runs first so an obvious break is
      # reported before six minutes of Gradle.
      - name: Static checks
        run: |
          python3 tools/syntax_check.py
          python3 tools/verify_model.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Loom's Minecraft artifacts are large and unchanging: caching them turns
      # the second and later runs from minutes into seconds.
      - name: Cache Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/loom-cache
            .gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: enderdragonanthro-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
