name: release

# Cut a release, with the jar attached.
#
# This exists because a release cannot be made from the machine the mod is
# written on. That session is allowed to push COMMITS and nothing else about a
# release: the API refuses outright --
#
#   Creating, editing, or deleting releases is not permitted for this
#   session type
#
# -- and pushing a tag is refused too, as a dropped connection rather than as
# an error, four attempts running, while branch pushes and ref reads go
# through fine. So neither half can be done from there, and a runner does both
# instead.
#
#   gh workflow run release.yml --ref <branch> -f tag=v0.1.0-prealpha
#
# The TAG IS CREATED HERE, by `gh release create --target`, pointing at the
# commit this run checked out. That is the whole reason the workflow takes a
# branch rather than a tag: if a tag could be pushed, none of this would need
# to exist.
#
# The jar is BUILT here rather than uploaded from anywhere, and that is the
# point rather than convenience. A release asset is the one artefact somebody
# else actually runs, and one built on the author's machine is the single
# thing in this project that nothing verifies -- build.yml exists precisely
# because that box cannot reach Fabric's maven. So what hangs off a release is
# what a runner compiled against real mapped Minecraft, or there is no release.
#
# A tag with a suffix after the version -- prealpha, alpha, beta, rc -- is
# marked as a pre-release, so it does not become the repository's "latest".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create, e.g. v0.1.0-prealpha'
        required: true
        default: 'v0.1.0-prealpha'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tool dependencies
        run: python3 -m pip install --quiet numpy pillow

      # The same gates a push gets, in the same order. A release is not a
      # reason to skip them -- it is the one build a stranger is going to run.
      - name: Static checks
        run: |
          python3 tools/syntax_check.py
          python3 tools/verify_model.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/loom-cache
            .gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      # Green with a broken mixin is the failure build.yml was written for. A
      # release must not be the one build that skips the check.
      - name: Check mixins resolved
        run: |
          if grep -n "Cannot remap" build.log; then
            echo "::error::A mixin names a target that does not exist in 1.21.1 (see above)."
            exit 1
          fi
          echo "Every mixin target resolved."

      - name: Run the game tests
        run: ./gradlew runGametest --no-daemon

      # The sources jar is not something anybody drops in a mods folder, and an
      # extra file on a release page is an extra thing to pick wrong.
      - name: Collect the mod jar
        id: jar
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          test -n "$jar"
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Releasing $jar"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" "${{ steps.jar.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file .github/release-notes.md \
            $pre
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
