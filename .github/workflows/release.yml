name: release

# Cut a release from a tag, with the jar attached.
#
# This exists because a release cannot be made from the machine the mod is
# written on: that session is allowed to push commits and tags and is refused
# outright on releases ("Creating, editing, or deleting releases is not
# permitted for this session type"). A runner has no such restriction, so
# pushing a tag is the way to ask for one.
#
# The jar is BUILT here rather than uploaded from anywhere. A release asset is
# the one artefact people actually run, and one built on the author's machine
# is the one thing in this project nothing else verifies -- the whole reason
# build.yml exists is that the local box cannot reach Fabric's maven. So the
# thing attached to a release is the thing a runner compiled against real
# mapped Minecraft, or there is no release.
#
#   git tag -a v0.1.0-prealpha -m "..." && git push origin v0.1.0-prealpha
#
# A tag containing a hyphenated suffix -- prealpha, alpha, beta, rc -- is
# marked as a pre-release, so it does not become the repository's "latest" and
# does not go out to anybody who is watching for stable builds.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tool dependencies
        run: python3 -m pip install --quiet numpy pillow

      # The same gates a push gets, in the same order. A tag is not a reason to
      # skip them -- it is the one build somebody else is going to run.
      - name: Static checks
        run: |
          python3 tools/syntax_check.py
          python3 tools/verify_model.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/loom-cache
            .gradle/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      # Green with a broken mixin is the failure mode build.yml was written for;
      # a release must not be the one build that skips the check.
      - name: Check mixins resolved
        run: |
          if grep -n "Cannot remap" build.log; then
            echo "::error::A mixin names a target that does not exist in 1.21.1 (see above)."
            exit 1
          fi
          echo "Every mixin target resolved."

      - name: Run the game tests
        run: ./gradlew runGametest --no-daemon

      # The sources jar is not something anybody drops in a mods folder, and an
      # extra file on a release page is an extra thing to pick wrong.
      - name: Collect the mod jar
        id: jar
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          test -n "$jar"
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Releasing $jar"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Anything with a suffix after the version is a pre-release.
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" "${{ steps.jar.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file .github/release-notes.md \
            $pre
